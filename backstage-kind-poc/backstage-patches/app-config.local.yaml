app:
  title: Developer Portal PoC
  baseUrl: http://localhost:3000

organization:
  name: DevOps PoC

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    host: 0.0.0.0
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'
  cache:
    store: memory
  auth:
    dangerouslyDisableDefaultAuthPolicy: true

# ── Auth ──────────────────────────────────────────────────────────────────────
auth:
  environment: development
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true

# ── Jenkins ───────────────────────────────────────────────────────────────────
jenkins:
  instances:
    - name: default
      baseUrl: http://mock-server.backstage.svc.cluster.local:4010
      username: admin
      apiKey: mock-api-token-abc123

# ── SonarQube ─────────────────────────────────────────────────────────────────
sonarqube:
  instances:
    - name: default
      baseUrl: http://mock-server.backstage.svc.cluster.local:4010/sonarqube
      apiKey: mock-sonar-token-xyz789

# ── ArgoCD ────────────────────────────────────────────────────────────────────
argocd:
  username: admin
  password: ${ARGOCD_ADMIN_PASSWORD}
  appLocatorMethods:
    - type: 'config'
      instances:
        - name: main
          url: https://argocd-server.argocd.svc.cluster.local
          token: ${ARGOCD_AUTH_TOKEN}

# ── Kubernetes ────────────────────────────────────────────────────────────────
kubernetes:
  serviceLocatorMethod:
    type: 'multiTenant'
  clusterLocatorMethods:
    - type: 'config'
      clusters:
        - name: kind-backstage
          url: https://kubernetes.default.svc
          authProvider: 'serviceAccount'
          skipTLSVerify: true
          skipMetricsLookup: false
          dashboardUrl: http://localhost:8001/api/v1/namespaces/kubernetes-dashboard/services/http:kubernetes-dashboard:/proxy/
          dashboardApp: 'standard'
          # Token will be auto-mounted from the ServiceAccount at
          # /var/run/secrets/kubernetes.io/serviceaccount/token

# ── Proxy (for direct frontend access) ───────────────────────────────────────
proxy:
  endpoints:
    '/jenkins/api':
      target: http://mock-server.backstage.svc.cluster.local:4010
      changeOrigin: true
      headers:
        Authorization: Basic YWRtaW46bW9jay1hcGktdG9rZW4tYWJjMTIz
    '/sonarqube':
      target: http://mock-server.backstage.svc.cluster.local:4010/sonarqube
      changeOrigin: true
      headers:
        Authorization: Basic bW9jay1zb25hci10b2tlbi14eXo3ODk6

# ── Techdocs ──────────────────────────────────────────────────────────────────
techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

# ── Catalog ───────────────────────────────────────────────────────────────────
catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Group, User, Domain]
  locations:
    # All services location (mounted into container at /app/catalog/)
    - type: file
      target: /app/catalog/all-services.yaml
      rules:
        - allow: [Component, Location]

# ── Scaffolder ────────────────────────────────────────────────────────────────
scaffolder:
  {}
