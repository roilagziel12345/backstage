apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backstage.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
data:
  app-config.yaml: |
    app:
      title: {{ .Values.appConfig.app.title | quote }}
      baseUrl: {{ .Values.appConfig.app.baseUrl | quote }}

    organization:
      name: {{ .Values.appConfig.organization.name | quote }}

    backend:
      baseUrl: {{ .Values.appConfig.backend.baseUrl | quote }}
      listen:
        port: {{ .Values.appConfig.backend.listen.port }}
        host: {{ .Values.appConfig.backend.listen.host | quote }}
      csp:
        connect-src: ["'self'", "http:", "https:"]
      cors:
        origin: {{ .Values.appConfig.backend.cors.origin | quote }}
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      database:
        client: better-sqlite3
        connection: ":memory:"
      cache:
        store: memory
      auth:
        dangerouslyDisableDefaultAuthPolicy: true

    auth:
      environment: development
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true

    jenkins:
      instances:
        - name: default
          baseUrl: http://mock-server.backstage.svc.cluster.local:4010
          username: admin
          apiKey: mock-api-token-abc123

    sonarqube:
      instances:
        - name: default
          baseUrl: http://mock-server.backstage.svc.cluster.local:4010/sonarqube
          apiKey: mock-sonar-token-xyz789

    argocd:
      username: admin
      password: ""
      appLocatorMethods:
        - type: config
          instances:
            - name: main
              url: https://argocd-server.argocd.svc.cluster.local
              token: ${ARGOCD_AUTH_TOKEN}

    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: kind-backstage
              url: https://kubernetes.default.svc
              authProvider: serviceAccount
              skipTLSVerify: true
              skipMetricsLookup: false

    proxy:
      endpoints:
        "/jenkins/api":
          target: http://mock-server.backstage.svc.cluster.local:4010
          changeOrigin: true
          headers:
            Authorization: Basic YWRtaW46bW9jay1hcGktdG9rZW4tYWJjMTIz
        "/sonarqube":
          target: http://mock-server.backstage.svc.cluster.local:4010/sonarqube
          changeOrigin: true
          headers:
            Authorization: Basic bW9jay1zb25hci10b2tlbi14eXo3ODk6

    techdocs:
      builder: local
      generator:
        runIn: local
      publisher:
        type: local

    catalog:
      import:
        entityFilename: catalog-info.yaml
        pullRequestBranchName: backstage-integration
      rules:
        - allow: [Component, System, API, Resource, Location, Group, User, Domain]
      locations:
        - type: file
          target: /app/catalog/all-services.yaml
          rules:
            - allow: [Component, Location]

    scaffolder: {}
