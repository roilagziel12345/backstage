apiVersion: v1
kind: Secret
metadata:
  name: backstage-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ArgoCD auth token — can be overridden with: helm upgrade ... --set secrets.argocdToken=<token>
  argocd-token: ""
