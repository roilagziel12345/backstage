nameOverride: notifications-api-18

replicaCount: 2

workload:
  type: Deployment

image:
  repository: image-registry.openshift-image-registry.svc:5000/client-06/notifications-api-18
  tag: 1.18.0
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: notifications-api-18

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8082
      targetPort: http
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: metrics

route:
  enabled: true
  host: "notifications-api-18.apps.demo-openshift.example.com"
  path: "/"
  wildcardPolicy: None
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

containerPorts:
  - name: http
    containerPort: 8082
    protocol: TCP
  - name: metrics
    containerPort: 9090
    protocol: TCP

env:
  - name: APP_NAME
    value: "notifications-api-18"
  - name: APP_NAMESPACE
    value: "client-06"
  - name: LOG_LEVEL
    valueFrom:
      configMapKeyRef:
        name: notifications-api-18-config
        key: LOG_LEVEL
  - name: API_TOKEN
    valueFrom:
      secretKeyRef:
        name: notifications-api-18-secret
        key: API_TOKEN
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: notifications-api-18-secret
        key: DB_PASSWORD

envFrom:
  - configMapRef:
      name: notifications-api-18-config
  - secretRef:
      name: notifications-api-18-secret

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: app-config
    mountPath: /etc/app
    readOnly: true

volumes:
  - name: tmp
    emptyDir: {}
  - name: app-config
    configMap:
      name: notifications-api-18-config

secret:
  enabled: true
  name: notifications-api-18-secret
  type: Opaque
  stringData:
    CLIENT_ID: "notifications-api-18-client"
    FEATURE_KEY: "notifications-feature-18"
  data:
    API_TOKEN: dG9rZW4tbm90aWZpY2F0aW9ucy1hcGktMTg=
    DB_PASSWORD: cGFzc3dvcmQtMTg=