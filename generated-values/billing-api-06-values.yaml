nameOverride: billing-api-06

replicaCount: 2

workload:
  type: Deployment

image:
  repository: image-registry.openshift-image-registry.svc:5000/client-06/billing-api-06
  tag: 1.6.0
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: billing-api-06

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: metrics

route:
  enabled: true
  host: "billing-api-06.apps.demo-openshift.example.com"
  path: "/"
  wildcardPolicy: None
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

containerPorts:
  - name: http
    containerPort: 8080
    protocol: TCP
  - name: metrics
    containerPort: 9090
    protocol: TCP

env:
  - name: APP_NAME
    value: "billing-api-06"
  - name: APP_NAMESPACE
    value: "client-06"
  - name: LOG_LEVEL
    valueFrom:
      configMapKeyRef:
        name: billing-api-06-config
        key: LOG_LEVEL
  - name: API_TOKEN
    valueFrom:
      secretKeyRef:
        name: billing-api-06-secret
        key: API_TOKEN
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: billing-api-06-secret
        key: DB_PASSWORD

envFrom:
  - configMapRef:
      name: billing-api-06-config
  - secretRef:
      name: billing-api-06-secret

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 768Mi

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: app-config
    mountPath: /etc/app
    readOnly: true

volumes:
  - name: tmp
    emptyDir: {}
  - name: app-config
    configMap:
      name: billing-api-06-config

secret:
  enabled: true
  name: billing-api-06-secret
  type: Opaque
  stringData:
    CLIENT_ID: "billing-api-06-client"
    FEATURE_KEY: "billing-feature-06"
  data:
    API_TOKEN: dG9rZW4tYmlsbGluZy1hcGktMDY=
    DB_PASSWORD: cGFzc3dvcmQtMDY=