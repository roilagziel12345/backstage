nameOverride: search-backend-19

replicaCount: 3

workload:
  type: Deployment

image:
  repository: image-registry.openshift-image-registry.svc:5000/client-01/search-backend-19
  tag: 1.19.0
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: search-backend-19

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8083
      targetPort: http
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: metrics

route:
  enabled: true
  host: "search-backend-19.apps.demo-openshift.example.com"
  path: "/"
  wildcardPolicy: None
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

containerPorts:
  - name: http
    containerPort: 8083
    protocol: TCP
  - name: metrics
    containerPort: 9090
    protocol: TCP

env:
  - name: APP_NAME
    value: "search-backend-19"
  - name: APP_NAMESPACE
    value: "client-01"
  - name: LOG_LEVEL
    valueFrom:
      configMapKeyRef:
        name: search-backend-19-config
        key: LOG_LEVEL
  - name: API_TOKEN
    valueFrom:
      secretKeyRef:
        name: search-backend-19-secret
        key: API_TOKEN
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: search-backend-19-secret
        key: DB_PASSWORD

envFrom:
  - configMapRef:
      name: search-backend-19-config
  - secretRef:
      name: search-backend-19-secret

resources:
  requests:
    cpu: 150m
    memory: 384Mi
  limits:
    cpu: 750m
    memory: 1024Mi

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: app-config
    mountPath: /etc/app
    readOnly: true

volumes:
  - name: tmp
    emptyDir: {}
  - name: app-config
    configMap:
      name: search-backend-19-config

secret:
  enabled: true
  name: search-backend-19-secret
  type: Opaque
  stringData:
    CLIENT_ID: "search-backend-19-client"
    FEATURE_KEY: "search-feature-19"
  data:
    API_TOKEN: dG9rZW4tc2VhcmNoLWJhY2tlbmQtMTk=
    DB_PASSWORD: cGFzc3dvcmQtMTk=