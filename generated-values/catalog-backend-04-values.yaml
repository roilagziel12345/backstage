nameOverride: catalog-backend-04

replicaCount: 4

workload:
  type: Deployment

image:
  repository: image-registry.openshift-image-registry.svc:5000/client-04/catalog-backend-04
  tag: 1.4.0
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: catalog-backend-04

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8083
      targetPort: http
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: metrics

route:
  enabled: true
  host: "catalog-backend-04.apps.demo-openshift.example.com"
  path: "/"
  wildcardPolicy: None
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

containerPorts:
  - name: http
    containerPort: 8083
    protocol: TCP
  - name: metrics
    containerPort: 9090
    protocol: TCP

env:
  - name: APP_NAME
    value: "catalog-backend-04"
  - name: APP_NAMESPACE
    value: "client-04"
  - name: LOG_LEVEL
    valueFrom:
      configMapKeyRef:
        name: catalog-backend-04-config
        key: LOG_LEVEL
  - name: API_TOKEN
    valueFrom:
      secretKeyRef:
        name: catalog-backend-04-secret
        key: API_TOKEN
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: catalog-backend-04-secret
        key: DB_PASSWORD

envFrom:
  - configMapRef:
      name: catalog-backend-04-config
  - secretRef:
      name: catalog-backend-04-secret

resources:
  requests:
    cpu: 150m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 1536Mi

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: app-config
    mountPath: /etc/app
    readOnly: true

volumes:
  - name: tmp
    emptyDir: {}
  - name: app-config
    configMap:
      name: catalog-backend-04-config

secret:
  enabled: true
  name: catalog-backend-04-secret
  type: Opaque
  stringData:
    CLIENT_ID: "catalog-backend-04-client"
    FEATURE_KEY: "catalog-feature-04"
  data:
    API_TOKEN: dG9rZW4tY2F0YWxvZy1iYWNrZW5kLTA0
    DB_PASSWORD: cGFzc3dvcmQtMDQ=