nameOverride: analytics-api-30

replicaCount: 2

workload:
  type: StatefulSet

image:
  repository: image-registry.openshift-image-registry.svc:5000/client-06/analytics-api-30
  tag: 1.30.0
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: analytics-api-30

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8084
      targetPort: http
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: metrics

route:
  enabled: true
  host: "analytics-api-30.apps.demo-openshift.example.com"
  path: "/"
  wildcardPolicy: None
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

containerPorts:
  - name: http
    containerPort: 8084
    protocol: TCP
  - name: metrics
    containerPort: 9090
    protocol: TCP

env:
  - name: APP_NAME
    value: "analytics-api-30"
  - name: APP_NAMESPACE
    value: "client-06"
  - name: LOG_LEVEL
    valueFrom:
      configMapKeyRef:
        name: analytics-api-30-config
        key: LOG_LEVEL
  - name: API_TOKEN
    valueFrom:
      secretKeyRef:
        name: analytics-api-30-secret
        key: API_TOKEN
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: analytics-api-30-secret
        key: DB_PASSWORD

envFrom:
  - configMapRef:
      name: analytics-api-30-config
  - secretRef:
      name: analytics-api-30-secret

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 768Mi

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: app-config
    mountPath: /etc/app
    readOnly: true

volumes:
  - name: tmp
    emptyDir: {}
  - name: app-config
    configMap:
      name: analytics-api-30-config

secret:
  enabled: true
  name: analytics-api-30-secret
  type: Opaque
  stringData:
    CLIENT_ID: "analytics-api-30-client"
    FEATURE_KEY: "analytics-feature-30"
  data:
    API_TOKEN: dG9rZW4tYW5hbHl0aWNzLWFwaS0zMA==
    DB_PASSWORD: cGFzc3dvcmQtMzA=

statefulSet:
  serviceName: analytics-api-30
  podManagementPolicy: OrderedReady