nameOverride: orders-api-12

replicaCount: 4

workload:
  type: Deployment

image:
  repository: image-registry.openshift-image-registry.svc:5000/client-06/orders-api-12
  tag: 1.12.0
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: orders-api-12

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: http
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: metrics

route:
  enabled: true
  host: "orders-api-12.apps.demo-openshift.example.com"
  path: "/"
  wildcardPolicy: None
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

containerPorts:
  - name: http
    containerPort: 8081
    protocol: TCP
  - name: metrics
    containerPort: 9090
    protocol: TCP

env:
  - name: APP_NAME
    value: "orders-api-12"
  - name: APP_NAMESPACE
    value: "client-06"
  - name: LOG_LEVEL
    valueFrom:
      configMapKeyRef:
        name: orders-api-12-config
        key: LOG_LEVEL
  - name: API_TOKEN
    valueFrom:
      secretKeyRef:
        name: orders-api-12-secret
        key: API_TOKEN
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: orders-api-12-secret
        key: DB_PASSWORD

envFrom:
  - configMapRef:
      name: orders-api-12-config
  - secretRef:
      name: orders-api-12-secret

resources:
  requests:
    cpu: 75m
    memory: 192Mi
  limits:
    cpu: 1000m
    memory: 1536Mi

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: app-config
    mountPath: /etc/app
    readOnly: true

volumes:
  - name: tmp
    emptyDir: {}
  - name: app-config
    configMap:
      name: orders-api-12-config

secret:
  enabled: true
  name: orders-api-12-secret
  type: Opaque
  stringData:
    CLIENT_ID: "orders-api-12-client"
    FEATURE_KEY: "orders-feature-12"
  data:
    API_TOKEN: dG9rZW4tb3JkZXJzLWFwaS0xMg==
    DB_PASSWORD: cGFzc3dvcmQtMTI=